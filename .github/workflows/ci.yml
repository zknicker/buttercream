name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A superseded deploy is never worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # @hugeicons-pro resolves from npm.hugeicons.com, a paid registry. bunfig.toml
      # authenticates with $HUGEICONS_LICENSE_KEY. Without it bun does not fail — it
      # blocks on the registry until the job times out, so check before installing.
      - name: Require the Hugeicons registry key
        env:
          HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
        run: |
          if [ -z "${HUGEICONS_LICENSE_KEY}" ]; then
            echo "::error::HUGEICONS_LICENSE_KEY is not set. @hugeicons-pro installs from the private npm.hugeicons.com registry and bun will hang rather than fail. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # VITE_CLERK_PUBLISHABLE_KEY is inlined into the client bundle at build time, not
      # read at runtime. Without it the app silently drops ClerkProvider and ships with
      # no sign-in at all — a deploy that looks healthy and has no auth. Fail here
      # instead, but only when a deploy would follow; pull requests build fine without.
      - name: Require the Clerk publishable key before deploying
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${VITE_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY is not set. The build would inline an empty key and deploy the studio without authentication. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install
        env:
          HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
        run: bun install --frozen-lockfile

      - name: Check
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: bun run check

      # Builds from the workspace root rather than calling the editor's own deploy
      # script, so this step does not quietly depend on `check` having built the
      # packages the editor imports. Costs about a minute of duplicate build; worth it
      # while this is the only path to production.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          bun run build
          cd apps/editor && bunx wrangler deploy

# D1 migrations are deliberately not applied here. Schema changes are rare, occasionally
# destructive, and share a database with local development (ADR 0004), so they stay a
# deliberate human action:
#
#   bunx wrangler d1 migrations apply buttercream-production --remote
#
# CLERK_SECRET_KEY is a Worker runtime secret, not a build input. Set it once with
# `bunx wrangler secret put CLERK_SECRET_KEY` from apps/editor; it is not needed here.
